[package]
name = "cyanbird"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
zstd = "0.13"
tauri = { version = "2", features = [] }

regex = "1"
percent-encoding = "2"
sha2 = "0.10"
